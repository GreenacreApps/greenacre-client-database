<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Isolated responsive checks</title><style>body{margin:0;font:14px system-ui;background:#e7ece9;color:#173f30}header{padding:10px 16px;background:white;position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:8px;flex-wrap:wrap}button{padding:8px 12px;border:1px solid #226653;border-radius:6px;background:white;color:#226653;cursor:pointer}#stage{overflow:auto;padding:12px}iframe{display:block;margin:auto;border:1px solid #bacbc0;background:white;height:810px;width:390px;max-width:none}#status{margin:0;padding:4px 16px;white-space:pre-wrap}</style></head><body><header><strong>Test environment — responsive checks</strong><button data-width="390">Mobile 390</button><button data-width="768">Tablet 768</button><button data-width="1024">Tablet 1024</button><button data-width="1366">Desktop 1366</button><button id="check">Check layout</button><span id="width">390 CSS pixels</span></header><pre id="status" role="status"></pre><div id="stage"><iframe id="app" title="Responsive asset app" src="/"></iframe></div><script>const frame=document.querySelector('#app');document.querySelectorAll('[data-width]').forEach(button=>button.onclick=()=>{frame.style.width=button.dataset.width+'px';document.querySelector('#width').textContent=button.dataset.width+' CSS pixels';document.querySelector('#status').textContent='';});document.querySelector('#check').onclick=()=>{const doc=frame.contentDocument,win=frame.contentWindow;const visible=el=>el.getClientRects().length&&win.getComputedStyle(el).visibility!=='hidden';const clipped=[...doc.querySelectorAll('main, .app-header, .panel, .database-intro, .database-search, .asset-photo-gallery, .modal-card')].filter(visible).filter(el=>el.getBoundingClientRect().right>win.innerWidth+1||el.getBoundingClientRect().left< -1).map(el=>el.id||el.className);document.querySelector('#status').textContent=JSON.stringify({viewport:win.innerWidth,pageWidth:doc.documentElement.scrollWidth,pageOverflow:doc.documentElement.scrollWidth>win.innerWidth+1,clippedPanels:clipped,photos:[...doc.querySelectorAll('img')].filter(visible).filter(el=>el.closest('main')).map(el=>({loaded:el.complete&&el.naturalWidth>0})),visibleText:doc.querySelector('main')?.innerText.includes('Server saved')},null,2);};</script></body></html>
