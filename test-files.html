<!doctype html><html lang="en"><meta charset="utf-8"><title>Test attachment transfer</title><style>body{max-width:950px;margin:40px auto;font:16px system-ui;padding:20px}button,input{font:inherit;margin:10px;padding:8px}li{margin:8px}pre{white-space:pre-wrap}</style><h1>Test attachment transfer</h1><p>Requires the test administrator session. Live attachments are read only.</p><label>Attachment manifest <input id="manifest" type="file" accept=".json"></label><ol id="links"></ol><label>Downloaded attachment files <input id="files" type="file" multiple></label><button id="upload">Copy selected files into test storage</button><pre role="status" id="status"></pre><script>
let entries=[];
const status=document.getElementById('status');
document.getElementById('manifest').onchange=async e=>{
const raw=JSON.parse(await e.target.files[0].text());entries=Array.isArray(raw)&&raw[0]?.payload?raw.flatMap(g=>g.payload.files.map(f=>({assetId:g.assetId,...f}))):raw;
document.getElementById('links').replaceChildren();entries.forEach((f,i)=>{f.localName ||= String(i+1).padStart(3,'0')+'.bin';const li=document.createElement('li'),a=document.createElement('a');a.textContent='Download attachment '+String(i+1).padStart(3,'0');a.href=new URL(f.url,'https://greenacreclientassetdatabase.netlify.app').href;if(new URL(a.href).origin!=='https://greenacreclientassetdatabase.netlify.app')throw Error('Invalid source origin');li.append(a,document.createTextNode(' — '+f.name));document.getElementById('links').append(li)});status.textContent=entries.length+' attachment entries loaded';};
document.getElementById('upload').onclick=async()=>{
if(location.hostname!=='greenacre-assets-test-20261022.netlify.app')throw Error('Wrong host');const selected=[...document.getElementById('files').files],button=document.getElementById('upload');button.disabled=true;let done=0;try{for(const file of selected){const meta=entries.find(f=>f.localName===file.name);if(!meta)throw Error('Unmatched file '+file.name);const bytes=await file.arrayBuffer();const hash=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',bytes))).map(x=>x.toString(16).padStart(2,'0')).join('');const body=new FormData();body.append('metadata',JSON.stringify({...meta,sha256:hash}));body.append('file',file);const r=await fetch('/api/test-attachment-restore',{method:'POST',credentials:'same-origin',body});const result=await r.text();if(!r.ok)throw Error(result);const saved=JSON.parse(result);if(saved.sha256!==hash)throw Error('Checksum mismatch');done++;status.textContent=done+' / '+selected.length+' attachments copied and checksum verified';}status.textContent+=' — Complete';}catch(e){status.textContent+=' — '+e.message}finally{button.disabled=false}};
</script></html>
